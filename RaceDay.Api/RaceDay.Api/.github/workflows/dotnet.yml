
name: RaceDay API CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay.Api/RaceDay.Api.sln

      - name: Build solution
        run: dotnet build RaceDay.Api/RaceDay.Api.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.Api/RaceDay.Api.sln --configuration Release --no-build
